<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Pages Test</title>
  <meta name="description" content="A simple static page deployed via GitHub Pages.">
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      color: #f8fafc;
    }
    main {
      max-width: 40rem;
      margin: 2rem;
      padding: 2rem;
      border-radius: 1rem;
      background: rgb(15 23 42 / 75%);
      box-shadow: 0 1rem 3rem rgb(15 23 42 / 35%);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: clamp(2rem, 5vw, 3rem);
    }
    p {
      line-height: 1.6;
    }
    a {
      color: #bfdbfe;
    }
  </style>
</head>
<body>
  <main>
    <h1>GitHub Pages is working</h1>
    <p>This repository now includes a plain static <code>index.html</code> page that is deployed with the existing GitHub Pages workflow.</p>
    <p>After deployment, this page will be available under <a href="/blog/gh-pages-test/">/blog/gh-pages-test/</a>.</p>
  </main>
</body>
</html>
